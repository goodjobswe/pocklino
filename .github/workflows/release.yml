name: Release

# Pushing a tag such as v1.0.0 builds the signed Android APK and the Windows
# ZIP and publishes both on the GitHub Releases page under that tag. Running
# the workflow by hand builds the same two files and keeps them as workflow
# artifacts, without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build the signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is the version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' pubspec.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but pubspec.yaml says $version." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the baseline documented in README.md.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Restore the signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Name the APK and check its signature
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "pocklino-${GITHUB_REF_NAME}.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "pocklino-${GITHUB_REF_NAME}.apk" | tee signature.txt
          if grep -q "Android Debug" signature.txt; then
            echo "The APK is signed with the debug key." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: pocklino-*.apk
          if-no-files-found: error

  windows:
    name: Build the Windows ZIP
    # Flutter 3.29.3 cannot find Visual Studio 2026, which windows-latest now
    # has. Go back to windows-latest together with a newer Flutter.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the baseline documented in README.md.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Pack the complete Release folder
        shell: pwsh
        run: |
          # The Visual C++ runtime beside the exe lets it start on a machine
          # that does not have the runtime installed.
          foreach ($name in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $env:SystemRoot "System32\$name") build\windows\x64\runner\Release\
          }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "pocklino-$env:GITHUB_REF_NAME-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: pocklino-*-windows.zip
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Add checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="pocklino-${GITHUB_REF_NAME}.apk"
          zip="pocklino-${GITHUB_REF_NAME}-windows.zip"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$zip" > "$zip.sha256"
          # Notes written for this version are used when they exist.
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$zip" "$zip.sha256" \
              --title "Pocklino $GITHUB_REF_NAME" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$zip" "$zip.sha256" \
              --title "Pocklino $GITHUB_REF_NAME" --generate-notes
          fi
