name: CI

# Automatic runs on push and pull request are turned off to save Actions
# minutes. Run it by hand from the Actions tab, or restore the push and
# pull_request triggers to turn it back on.
on:
  workflow_dispatch:

jobs:
  check:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the baseline documented in README.md.
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
      - run: flutter build apk --debug
